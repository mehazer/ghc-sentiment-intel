[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ghc-sentiment-intel"
version = "0.1.0"
description = "Crypto sentiment, attention and smart-money intelligence for Gradual Hedge Cropping"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "prometheus-client>=0.20",
  "defusedxml>=0.7",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
api = ["psycopg[binary]>=3.1"]
ml = ["xgboost>=2.0", "lightgbm>=4.3", "catboost>=1.2"]
nlp = ["transformers>=4.40", "torch>=2.2", "sentence-transformers>=2.7", "bertopic>=0.16"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
ghc-ingest = "ghc.ingestion.scheduler:main"
ghc-api = "uvicorn:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PL", "S", "BLE"]
ignore = [
  "B008",   # FastAPI dependency injection in defaults
  "BLE001", # connectors intentionally isolate third-party failures
  "S110",   # and log them instead
  "S311",   # jitter uses a non-crypto RNG by design
  "PLR0913",# engine signatures stay explicit
  "PLR0917",
  "PLR2004",
  "PLC0415",# lazy imports keep optional deps optional and break import cycles
  "PLR0912",# score assembly is intentionally one readable pass
  "PLR0915",
  "UP042",  # str-Enum keeps JSON serialisation simple
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "S101", "PLR2004"]
"scripts/*" = ["T201"]
